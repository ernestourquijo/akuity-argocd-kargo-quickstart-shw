apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: guestbook
  namespace: akuity-argocd-kargo-quickstart
spec:
  subscriptions:
  - image:
      repoURL: ghcr.io/akuity/guestbook
      imageSelectionStrategy: SemVer
      # allowTags (string) was deprecated in Kargo v1.9.0, fails artifact
      # discovery as of v1.11.0, and is removed in v1.13.0.
      allowTagsRegexes:
      - ^v?[0-9]+\.[0-9]+\.[0-9]+([\+-].*)?$
  - git:
      repoURL: https://github.com/ernestourquijo/akuity-argocd-kargo-quickstart-shw.git
      branch: main
      excludePaths:
      - apps